services:
  db:
    image: postgres:15
    container_name: task-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tasks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: task-service
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql://user:password@db:5432/tasks_db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: